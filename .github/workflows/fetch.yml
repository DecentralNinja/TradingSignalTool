name: Fetch market data

on:
  schedule:
    # Offset from :00/:15/:30/:45 — GitHub documents those as the highest-load,
    # most delay-prone times for scheduled workflows.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: fetcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node index.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
